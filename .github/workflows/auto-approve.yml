name: Auto Approve Pull Requests

# Trigger when:
# - A pull request is opened
# - A pull request is synchronize (new commit pushed)
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load approval config
        id: config
        run: |
          if [ -f "auto-approve-config.json" ]; then
            CONFIG=$(cat auto-approve-config.json)
          else
            CONFIG='{"approveDependabot":true,"approveLabels":[],"approveAuthors":["dependabot[bot]"],"approveFilesOnly":[]}'
          fi
          echo "config=$CONFIG" >> $GITHUB_OUTPUT

      - name: Check if PR should be approved
        id: should_approve
        uses: actions/github-script@v7
        with:
          script: |
            const config = ${{ steps.config.outputs.config }};
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const labels = pr.labels.map(label => label.name);

            console.log('PR Author:', author);
            console.log('PR Labels:', labels);
            console.log('Config:', config);

            let shouldApprove = false;
            let approvalReason = '';

            // Check if Dependabot PR and approveDependabot is enabled
            if (config.approveDependabot && author === 'dependabot[bot]') {
              shouldApprove = true;
              approvalReason = 'Auto-approved: Dependabot PR';
            }

            // Check if author is in approve list
            if (!shouldApprove && config.approveAuthors && config.approveAuthors.includes(author)) {
              shouldApprove = true;
              approvalReason = `Auto-approved: Author "${author}" is in approval list`;
            }

            // Check if any label matches approval labels
            if (!shouldApprove && config.approveLabels) {
              const matchedLabel = labels.find(label => config.approveLabels.includes(label));
              if (matchedLabel) {
                shouldApprove = true;
                approvalReason = `Auto-approved: Label "${matchedLabel}" triggers approval`;
              }
            }

            core.setOutput('should_approve', shouldApprove);
            core.setOutput('reason', approvalReason);

            if (shouldApprove) {
              console.log('✅', approvalReason);
            } else {
              console.log('⏭️  PR does not match approval criteria - manual review required');
            }

      - name: Approve pull request
        if: steps.should_approve.outputs.should_approve == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN_APPROVAL || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo, number } = context.issue;

            try {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number: number,
                event: 'APPROVE',
                body: '${{ steps.should_approve.outputs.reason }}'
              });
              console.log('✅ PR Approved successfully!');
            } catch (error) {
              console.error('❌ Failed to approve PR:', error.message);
              throw error;
            }

      - name: Log approval status
        if: always()
        run: |
          echo "Approval Status: ${{ steps.should_approve.outputs.should_approve }}"
          echo "Reason: ${{ steps.should_approve.outputs.reason }}"
